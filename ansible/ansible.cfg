[defaults]
roles_path = roles
# In-repo copy first (reproducible, matches requirements.yml's exact pins);
# falls back to the pre-existing global cache so this doesn't break a host
# that installed collections before this path was added.
collections_path = collections:~/.ansible/collections
retry_files_enabled = False
# Do NOT flip this to False. why: see docs/decisions.md#ssh-host-key.
host_key_checking = True
result_format = yaml
forks = 20

[ssh_connection]
pipelining = True
# ControlMaster/ControlPersist (connection reuse) + StrictHostKeyChecking=accept-new
# (trust-on-first-use: accept an unknown key, hard-fail a known key that changes).
# This is the single canonical place for both: ssh_args applies to every task
# through Ansible's ssh connection plugin (today only `hosts: claude_box` in
# configure.yml). Do NOT re-add a per-host ansible_ssh_common_args override —
# ssh_args composes first and OpenSSH takes the first value for a repeated -o.
# Why these exact choices + the composition proof: docs/decisions.md#ssh-host-key.
# Raw `ssh` binaries (bootstrap's post-restart probe, scripts/ssh.sh) do NOT read
# ssh_args; each keeps its own accept-new copy in sync with the intent here.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new