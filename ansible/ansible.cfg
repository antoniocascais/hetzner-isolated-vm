[defaults]
roles_path = roles
# In-repo copy first (reproducible, matches requirements.yml's exact pins);
# falls back to the pre-existing global cache so this doesn't break a host
# that installed collections before this path was added.
collections_path = collections:~/.ansible/collections
retry_files_enabled = False
# Left at the ansible-core default (True) deliberately: do NOT flip this to False.
# Flipping it would not break accept-new below -- PROVEN by reading
# .venv/lib/python*/site-packages/ansible/plugins/connection/ssh.py
# (ansible-core 2.21.1): ssh_args is appended at L839-844; the
# `-o StrictHostKeyChecking=no` that host_key_checking=False injects is appended
# AFTER that, at L847-849, and OpenSSH takes the FIRST value it sees for a
# repeated -o option (confirmed: `ssh -F /dev/null -o
# StrictHostKeyChecking=accept-new -o StrictHostKeyChecking=no -G host` resolves
# to accept-new; reversing the order resolves to no). Confirmed end-to-end with
# ANSIBLE_HOST_KEY_CHECKING=False and -vvvv against an unroutable probe host:
# both flags appear on the real command line, accept-new first. Keep True
# anyway: `host_key_checking` is read again at ssh.py:1374, in the
# password-auth failure path, where it upgrades a bare "Host key verification
# failed" into a fingerprint hint. Not live here (key-auth only -- see
# ansible_ssh_private_key_file in configure.yml), but True is the correct
# posture and leaves no footgun for a future password-auth path.
host_key_checking = True
result_format = yaml
forks = 20

[ssh_connection]
pipelining = True
# ControlMaster/ControlPersist (connection reuse) + StrictHostKeyChecking=accept-new
# (trust-on-first-use: silently accept a host's key the first time it's seen, but
# hard-fail if a KNOWN host's key later changes -- the real MITM signal). This is
# the single, canonical place for both: `ssh_args` here applies to every task that
# goes through Ansible's ssh connection plugin, for every current and future play
# in this repo (today that's only `hosts: claude_box` in playbooks/configure.yml --
# confirmed by grepping every playbook under ansible/playbooks/ for `hosts:`; every
# other play is `hosts: localhost` / `connection: local` and never touches this).
#
# accept-new is the right posture for a box that's destroyed and recreated
# routinely: plain `StrictHostKeyChecking=yes` would block every fresh box on an
# unknown-key prompt Ansible can't answer non-interactively; `no` would silently
# accept a changed key too, which is the actual attack this exists to catch. See
# RUNBOOK.md's Day-2 section for the operational trap this creates: a rebuilt box
# reusing a client's stale known_hosts entry for its address will correctly
# hard-fail as "host key changed" -- that's accept-new working as intended, not a
# bug; fix is `ssh-keygen -R`, not weakening this setting.
#
# ansible_ssh_common_args (a play/host var, e.g. in configure.yml) is ADDITIVE with
# ssh_args, not a replacement for it -- PROVEN by reading
# .venv/lib/python*/site-packages/ansible/plugins/connection/ssh.py (ansible-core
# 2.21.1): ssh_args is appended at L839-844; ssh_common_args (the internal option
# ansible_ssh_common_args feeds) is appended separately, later, at L895-899 (the
# actual append call is line 899) -- both onto the same command, neither
# replacing the other. Confirmed again at
# L1594-1597, where `_is_tty_requested` walks `('ssh_args', 'ssh_common_args',
# 'ssh_extra_args')` as three independent, simultaneously-active option sources.
# There is currently no other file setting ansible_ssh_common_args in this repo,
# so nothing here is being overridden in practice either way.
#
# Two OTHER places in this repo also hardcode `-o StrictHostKeyChecking=accept-new`
# and are NOT redundant with this setting: ansible/roles/bootstrap/tasks/main.yml's
# post-restart reachability probe and scripts/ssh.sh both invoke the `ssh` binary
# directly (not through Ansible's connection plugin), so neither reads ssh_args or
# ansible_ssh_common_args at all -- each needs its own copy of the flag. Keep those
# in sync with the intent described here if this policy ever changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
