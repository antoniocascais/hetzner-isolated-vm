[defaults]
roles_path = roles
# In-repo copy first (reproducible, matches requirements.yml's exact pins);
# falls back to the pre-existing global cache so this doesn't break a host
# that installed collections before this path was added.
collections_path = collections:~/.ansible/collections
retry_files_enabled = False
# Do NOT flip this to False. why: see docs/decisions.md#ssh-host-key.
host_key_checking = True
result_format = yaml
forks = 20

[ssh_connection]
pipelining = True
# Connection reuse + TOFU (accept-new: take an unknown key, hard-fail a changed
# one). Single canonical place — do NOT re-add a per-host ansible_ssh_common_args
# override (a different value is silently ignored). Raw `ssh` invocations
# (bootstrap probe, scripts/ssh.sh) don't read this and keep their own copies.
# Proof: docs/decisions.md#ssh-host-key.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
