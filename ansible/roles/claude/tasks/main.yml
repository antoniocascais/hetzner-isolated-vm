---
# Installs Node.js + Claude Code on the sandbox box.

- name: "Install base packages"
  ansible.builtin.apt:
    name: "{{ claude.extra_packages }}"
    state: present
    update_cache: true

- name: "Check existing node major version"
  ansible.builtin.command: node --version
  register: node_check
  changed_when: false
  failed_when: false

- name: "Add NodeSource repo + install Node.js"
  when: node_check.rc != 0 or (node_check.stdout | default('v0') | regex_replace('^v([0-9]+).*', '\\1') | int) != claude.node_major
  block:
    - name: "Download NodeSource setup script"
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ claude.node_major }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: "Run NodeSource setup script"
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      changed_when: true

    - name: "Install nodejs"
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

- name: "Install Claude Code globally"
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: latest

- name: "Ensure workspace dir"
  ansible.builtin.file:
    path: "{{ claude.workspace }}"
    state: directory
    owner: "{{ box.user }}"
    group: "{{ box.user }}"
    mode: "0750"
