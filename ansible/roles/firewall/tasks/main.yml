---
# Manages the Hetzner Cloud firewall via API (no SSH to the box needed).
# Applies `firewall_rules` verbatim. Empty list == deny-all inbound.

- name: "Ensure Hetzner API token available"
  ansible.builtin.assert:
    that:
      - hcloud_api_token is defined
      - hcloud_api_token | length > 0
    fail_msg: "Hetzner API token missing. Set HCLOUD_TOKEN in .env."

- name: "Guard against world-open inbound rules"
  # The box's doctrine is "inbound from the operator's single host only,
  # period" — for SSH or any other port. So EVERY inbound rule must name at
  # least one source via source_ips, and every such entry must be exactly
  # one host. `port_covers_ssh` (below) no longer gates whether the guard
  # runs; it survives only to sharpen the failure message when a rule happens
  # to cover BOX_SSH_PORT.
  #
  # source_ips scope: every entry on an inbound rule must name exactly one
  # host — /32 for IPv4, /128 for IPv6. Rejecting only the literal strings
  # "0.0.0.0/0" and "::/0" is not enough: "10.0.0.0/8", "0.0.0.0/1",
  # "192.0.0.0/2", or a bare "1.2.3.4" with no prefix are all wider than a
  # single host and would pass an exact-string check — hence the per-entry
  # format check below.
  #
  # Regex, not a CIDR-math library: the `ipaddr` filter needs the python
  # netaddr library (requirements.txt pins no netaddr) or the ansible.utils
  # collection (not vendored — evidence in detect-public-ip.yml's "Reject
  # anything that isn't a syntactically valid IPv4 address" task). Either
  # would be a hard runtime failure on this repo's pinned setup.
  #
  # IPv6 caveat, stated plainly: the /128 pattern below is a *shape* check
  # (hex groups joined by colons, ending literally in "/128") — it is not
  # full RFC 4291 validation. It will not catch every malformed address
  # (e.g. more than one "::" compression), and doesn't special-case
  # embedded-IPv4 forms like "::ffff:1.2.3.4/128". Hetzner's own API is the
  # backstop for full address correctness on apply; this guard's job is
  # narrower — reject anything wider than a single host — and it does that
  # for both families since a malformed-but-plausible-looking v6 entry
  # would otherwise sail through unchecked.
  #
  # Anchor choice, `\Z` not `$`: `is match()` runs Python's `re.match()`,
  # where `$` matches either true end-of-string OR just before a single
  # trailing "\n" at end-of-string — so "1.2.3.4/32\n" and "::1/128\n" would
  # satisfy a `$`-anchored pattern and sail through as if they were clean
  # single hosts, without needing netaddr, ansible.utils, or anything else
  # unvendored to catch. `\Z` matches true end-of-string only. Proven with
  # ansible-core 2.21.1 against this exact vars: block spliced verbatim out
  # of this file: with `$`, "1.2.3.4/32\n" and "::1/128\n" both passed the
  # guard (wrong); leading-newline, leading/trailing space, trailing tab,
  # and trailing "\r\n" variants were all still correctly rejected even with
  # `$`, since Python's `$` leniency is specifically "one trailing LF", not
  # "any trailing junk". `is_range`'s port-range pattern also carries `\Z`,
  # but for that one the anchor alone is NOT enough and would make things
  # WORSE on its own: a non-match on ipv4_slash32/ipv6_slash128 fails
  # *closed* ("not a single host" -> rejected). `port_str` is trimmed below
  # before is_any/is_exact/is_range see it, keeping `\Z` safe everywhere:
  # stray whitespace can only ever WIDEN what counts as SSH-covering (used
  # only for the error message now), never narrow what gets guarded.
  #
  # Empty source_ips on an inbound rule is treated as a hard failure, not a
  # vacuous pass: formally "every entry is a single host" is true over zero
  # entries, but an inbound rule with no named source is either a bug
  # upstream (e.g. IP detection returned nothing) or ambiguous about how
  # Hetzner's API would actually treat it — unverified either way, and this
  # guard fails closed on ambiguity rather than staying silent.
  #
  # Direction matters: only an EXPLICIT `direction: out` is exempt — anything
  # else (missing, "in", or any unrecognised value) is treated as inbound and
  # still gets checked. Deliberately not `item.direction | default('in') ==
  # 'in'`: that form only defaults *absent* direction to inbound but silently
  # skips the guard for any value that isn't literally "in" (e.g. a typo, or
  # a future Hetzner value this file doesn't know about yet). For a backstop
  # whose whole job is catching what it doesn't expect, "anything I don't
  # recognise still gets checked" is the safer default; only a value this
  # file positively knows means "not inbound" should turn the check off. An
  # outbound rule (`direction: out`) uses `destination_ips`, not `source_ips`,
  # so without this an outbound rule would read as "source_ips is empty" and
  # hard-fail the empty-source_ips clause even though it's not an
  # inbound-exposure question at all.
  #
  # IPv4 octets, no leading zeros: `1[0-9]{2}` / `[1-9]?[0-9]` (not
  # `[01]?[0-9]?[0-9]`) deliberately matches the sibling ipv4_strict_regex in
  # detect-public-ip.yml, so "010.0.0.1/32" is rejected here the same way it
  # rejects "010.0.0.1" there — two regexes in one changeset disagreeing on
  # what counts as a valid octet would otherwise be a trap for the next
  # reader. Leading zeros in IPv4 octets are ambiguous in practice (some
  # historical parsers treat them as octal), so rejecting them outright
  # rather than guessing is the same fail-closed posture as everything else
  # in this guard.
  ansible.builtin.assert:
    that:
      - not (is_inbound and (source_ips_list | length == 0))
      - not (is_inbound and (non_single_host_ips | length > 0))
    fail_msg: >-
      Refusing inbound rule{{ ' (port ' + (item.port | default('any/unset') | string) + ', which covers SSH port ' + (box.ssh_port | string) + ')' if port_covers_ssh else '' }}.
      {{ 'source_ips is empty — an inbound rule must name at least one host.'
         if (source_ips_list | length == 0)
         else 'Every source_ips entry must be a single host (/32 IPv4 or /128 IPv6); not single-host: ' + (non_single_host_ips | join(', ')) + '.' }}
      Access must be your /32 (or /128) only.
  vars:
    port_str: "{{ item.port | default('') | string | trim }}"
    is_any: "{{ port_str == 'any' }}"
    is_exact: "{{ port_str == (box.ssh_port | string) }}"
    is_range: "{{ port_str is match('^[0-9]+-[0-9]+\\Z') }}"
    range_lo: "{{ port_str.split('-')[0] if is_range else 0 }}"
    range_hi: "{{ port_str.split('-')[1] if is_range else 0 }}"
    in_range: "{{ is_range and (range_lo | int) <= (box.ssh_port | int) and (box.ssh_port | int) <= (range_hi | int) }}"
    is_inbound: "{{ (item.direction | default('in')) != 'out' }}"
    port_covers_ssh: "{{ is_inbound and (is_any or is_exact or in_range) }}"
    source_ips_list: "{{ item.source_ips | default([]) }}"
    ipv4_slash32: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32\Z'
    ipv6_slash128: '^(?:[0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}/128\Z'
    non_single_host_ips: "{{ source_ips_list | reject('match', ipv4_slash32) | reject('match', ipv6_slash128) | list }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.description | default(item.port | default('?')) }}"

- name: "Ensure firewall exists with desired rules"
  hetzner.hcloud.firewall:
    api_token: "{{ hcloud_api_token }}"
    name: "{{ firewall.name }}"
    state: present
    labels: "{{ firewall.labels | default({}) }}"
    rules: "{{ firewall_rules }}"

- name: "Look up target server by name"
  hetzner.hcloud.server_info:
    api_token: "{{ hcloud_api_token }}"
    name: "{{ box.name }}"
  register: fw_server

# No hard fail when the server is missing: this role is reached via
# `make allow-ip` (allow-ip.yml), which is explicitly meant to work before
# the box exists yet -- e.g. pre-seeding your IP right before `make create`.
# The firewall OBJECT and its rules are created/updated above unconditionally
# either way; only the ATTACH step (which needs a real server ID) is
# conditional. Server creation passes the firewall by name (`firewalls:` in
# create.yml), so the attach below only ever fires on the allow-ip path when
# the server already exists.
- name: "Attach firewall to server (skipped if the server doesn't exist yet)"
  hetzner.hcloud.firewall_resource:
    api_token: "{{ hcloud_api_token }}"
    firewall: "{{ firewall.name }}"
    servers: ["{{ box.name }}"]
    state: present
  when: fw_server.hcloud_server_info | default([]) | length > 0

- name: "Note: firewall rules are set, but not attached to any server yet"
  ansible.builtin.debug:
    msg: >-
      Server '{{ box.name }}' not found — firewall '{{ firewall.name }}'
      and its rules are up to date, but not attached to anything yet. Run
      'make create' to bring up the server (it attaches this firewall
      automatically), or re-run this after it exists.
  when: fw_server.hcloud_server_info | default([]) | length == 0