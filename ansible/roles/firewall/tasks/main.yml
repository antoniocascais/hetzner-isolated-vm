---
# Manages the Hetzner Cloud firewall via API (no SSH to the box needed).
# Applies `firewall_rules` verbatim. Empty list == deny-all inbound.

- name: "Ensure Hetzner API token available"
  ansible.builtin.assert:
    that:
      - hcloud_api_token is defined
      - hcloud_api_token | length > 0
    fail_msg: "Hetzner API token missing. Set HCLOUD_TOKEN in .env."

- name: "Guard against accidental world-open rules covering BOX_SSH_PORT"
  # A rule can cover the SSH port without matching it exactly: Hetzner's
  # `port` field also accepts the literal "any" and "lo-hi" ranges.
  # port_covers_ssh checks all three shapes.
  #
  # source_ips scope: every entry on an SSH-covering rule must name exactly
  # one host — /32 for IPv4, /128 for IPv6. Rejecting only the literal
  # strings "0.0.0.0/0" and "::/0" is not enough: "10.0.0.0/8", "0.0.0.0/1",
  # "192.0.0.0/2", or a bare "1.2.3.4" with no prefix are all wider than a
  # single host and would pass an exact-string check — hence the per-entry
  # format check below.
  #
  # Regex, not a CIDR-math library: the `ipaddr` filter needs the python
  # netaddr library (requirements.txt pins no netaddr) or the ansible.utils
  # collection (not vendored — evidence in detect-public-ip.yml's "Reject
  # anything that isn't a syntactically valid IPv4 address" task). Either
  # would be a hard runtime failure on this repo's pinned setup.
  #
  # IPv6 caveat, stated plainly: the /128 pattern below is a *shape* check
  # (hex groups joined by colons, ending literally in "/128") — it is not
  # full RFC 4291 validation. It will not catch every malformed address
  # (e.g. more than one "::" compression), and doesn't special-case
  # embedded-IPv4 forms like "::ffff:1.2.3.4/128". Hetzner's own API is the
  # backstop for full address correctness on apply; this guard's job is
  # narrower — reject anything wider than a single host — and it does that
  # for both families since a malformed-but-plausible-looking v6 entry
  # would otherwise sail through unchecked.
  #
  # Anchor choice, `\Z` not `$`: `is match()` runs Python's `re.match()`,
  # where `$` matches either true end-of-string OR just before a single
  # trailing "\n" at end-of-string — so "1.2.3.4/32\n" and "::1/128\n" would
  # satisfy a `$`-anchored pattern and sail through as if they were clean
  # single hosts, without needing netaddr, ansible.utils, or anything else
  # unvendored to catch. `\Z` matches true end-of-string only. Proven with
  # ansible-core 2.21.1 against this exact vars: block spliced verbatim out
  # of this file: with `$`, "1.2.3.4/32\n" and "::1/128\n" both passed the
  # guard (wrong); leading-newline, leading/trailing space, trailing tab,
  # and trailing "\r\n" variants were all still correctly rejected even with
  # `$`, since Python's `$` leniency is specifically "one trailing LF", not
  # "any trailing junk". `is_range`'s port-range pattern also carries `\Z`,
  # but for that one the anchor alone is NOT enough and would make things
  # WORSE on its own: a non-match on ipv4_slash32/ipv6_slash128 fails
  # *closed* ("not a single host" -> rejected), but a non-match on is_range
  # fails *open* ("not a range" -> port_covers_ssh false -> guard skipped
  # entirely). Proven: with port "9000-9500\n" and a world-open source, `$`
  # made is_range True and in_range True via `| int`'s own whitespace
  # stripping ("9500\n" | int == 9500) — guard fired, rule rejected. `\Z`
  # alone made is_range False — in_range never evaluated, `| int` never ran,
  # guard SKIPPED, world-open rule would sail through. So `port_str` is
  # trimmed below before any of is_any/is_exact/is_range see it, making
  # `\Z` safe everywhere: stray whitespace can now only ever WIDEN what
  # counts as SSH-covering (a dirty value that used to slip past a check
  # now gets checked), never narrow it.
  #
  # Empty source_ips on an SSH-covering rule is treated as a hard failure,
  # not a vacuous pass: formally "every entry is a single host" is true
  # over zero entries, but an SSH rule with no named source is either a bug
  # upstream (e.g. IP detection returned nothing) or ambiguous about how
  # Hetzner's API would actually treat it — unverified either way, and this
  # guard fails closed on ambiguity rather than staying silent.
  #
  # Direction matters: port_covers_ssh only skips for an EXPLICIT
  # `direction: out` — anything else (missing, "in", or any unrecognised
  # value) is treated as inbound and still gets checked. Deliberately not
  # `item.direction | default('in') == 'in'`: that form only defaults
  # *absent* direction to inbound but silently skips the guard for any
  # value that isn't literally "in" (e.g. a typo, or a future Hetzner value
  # this file doesn't know about yet) — proven: direction "OUT" and
  # direction "inbound" both produced covers_ssh=False and a skipped guard
  # under that form, the second case being exactly the unsafe branch (a
  # near-miss value silently treated as not covering SSH). For a backstop
  # whose whole job is catching what it doesn't expect, "anything I don't
  # recognise still gets checked" is the safer default; only a value this
  # file positively knows means "not inbound" should turn the check off.
  # An outbound rule (`direction: out`) uses `destination_ips`, not
  # `source_ips`, so without this an outbound rule on the SSH port would
  # read as "source_ips is empty" and hard-fail the empty-source_ips clause
  # above even though it's not an inbound-exposure question at all — proven
  # on real ansible-core 2.21.1. Fails closed either way (it forbids the
  # rule rather than silently under-checking it), so the original gap this
  # replaces was never a security hole, just a false positive that would
  # have blocked a legitimate future egress rule.
  #
  # IPv4 octets, no leading zeros: `1[0-9]{2}` / `[1-9]?[0-9]` (not
  # `[01]?[0-9]?[0-9]`) deliberately matches the sibling ipv4_strict_regex in
  # detect-public-ip.yml, so "010.0.0.1/32" is rejected here the same way it
  # rejects "010.0.0.1" there — two regexes in one changeset disagreeing on
  # what counts as a valid octet would otherwise be a trap for the next
  # reader. Leading zeros in IPv4 octets are ambiguous in practice (some
  # historical parsers treat them as octal), so rejecting them outright
  # rather than guessing is the same fail-closed posture as everything else
  # in this guard.
  #
  # A rule with no `port` key at all does not trip port_covers_ssh (port_str
  # defaults to '', matching none of is_any/is_exact/in_range) — unchanged
  # from before this edit. Hetzner requires `port` for tcp/udp rules, so in
  # practice this only exempts non-port protocols (icmp, esp, gre), which
  # cannot carry SSH traffic regardless of source_ips; unverified against
  # Hetzner's actual API validation, since nothing here runs against it.
  ansible.builtin.assert:
    that:
      - not (port_covers_ssh and (source_ips_list | length == 0))
      - not (port_covers_ssh and (non_single_host_ips | length > 0))
    fail_msg: >-
      Refusing rule for port {{ item.port | default('any/unset') }} — it
      covers SSH (port {{ box.ssh_port }}).
      {{ 'source_ips is empty — an SSH-covering rule must name at least one host.'
         if (source_ips_list | length == 0)
         else 'Every source_ips entry must be a single host (/32 IPv4 or /128 IPv6); not single-host: ' + (non_single_host_ips | join(', ')) + '.' }}
      Access must be your /32 (or /128) only.
  vars:
    port_str: "{{ item.port | default('') | string | trim }}"
    is_any: "{{ port_str == 'any' }}"
    is_exact: "{{ port_str == (box.ssh_port | string) }}"
    is_range: "{{ port_str is match('^[0-9]+-[0-9]+\\Z') }}"
    range_lo: "{{ port_str.split('-')[0] if is_range else 0 }}"
    range_hi: "{{ port_str.split('-')[1] if is_range else 0 }}"
    in_range: "{{ is_range and (range_lo | int) <= (box.ssh_port | int) and (box.ssh_port | int) <= (range_hi | int) }}"
    is_inbound: "{{ (item.direction | default('in')) != 'out' }}"
    port_covers_ssh: "{{ is_inbound and (is_any or is_exact or in_range) }}"
    source_ips_list: "{{ item.source_ips | default([]) }}"
    ipv4_slash32: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32\Z'
    ipv6_slash128: '^(?:[0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}/128\Z'
    non_single_host_ips: "{{ source_ips_list | reject('match', ipv4_slash32) | reject('match', ipv6_slash128) | list }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.description | default(item.port | default('?')) }}"

- name: "Ensure firewall exists with desired rules"
  hetzner.hcloud.firewall:
    api_token: "{{ hcloud_api_token }}"
    name: "{{ firewall.name }}"
    state: present
    labels: "{{ firewall.labels | default({}) }}"
    rules: "{{ firewall_rules }}"

- name: "Look up target server by name"
  hetzner.hcloud.server_info:
    api_token: "{{ hcloud_api_token }}"
    name: "{{ box.name }}"
  register: fw_server

# No hard fail when the server is missing BY DEFAULT: this role is reachable
# via `make allow-ip` (allow-ip.yml), which is explicitly meant to work
# before the box exists yet -- e.g. pre-seeding your IP right before
# `make create`. The firewall OBJECT and its rules are created/updated above
# unconditionally either way; only the ATTACH step (which needs a real
# server ID) is conditional there.
#
# `create.yml`, however, calls this role right after creating the server in
# the SAME play -- if the lookup below still can't find it (read-after-write
# lag, a transient API blip, a BOX_NAME mismatch), silently skipping the
# attach and falling through to the allow-ip-flavoured "run make create"
# debug would be actively wrong there (nonsensical mid-`make create`) and,
# far worse, would let the play reach create.yml's own closing banner
# ("Inbound SSH open from <cidr> only; all else denied.") on a server that
# is actually unprotected -- a running, billing, internet-reachable box
# reported to the operator as green with no firewall attached at all and no
# break-glass. `firewall_require_attach` (set by create.yml, left unset/false
# by allow-ip.yml) makes that a loud failure on the path that needs it,
# without taking away allow-ip's pre-seed-before-the-box-exists use case.
- name: "Server must exist on this path (create.yml only, via firewall_require_attach)"
  ansible.builtin.assert:
    that:
      - fw_server.hcloud_server_info | default([]) | length > 0
    fail_msg: >-
      Server '{{ box.name }}' not found after creation — refusing to leave
      firewall '{{ firewall.name }}' unattached. Its rules are up to date,
      but nothing is actually filtering traffic to any server right now.
      This usually means read-after-write lag against Hetzner's API (re-run
      to retry) or BOX_NAME drifted between the create step and this check.
  when: firewall_require_attach | default(false)

- name: "Attach firewall to server (skipped if the server doesn't exist yet)"
  hetzner.hcloud.firewall_resource:
    api_token: "{{ hcloud_api_token }}"
    firewall: "{{ firewall.name }}"
    servers: ["{{ box.name }}"]
    state: present
  when: fw_server.hcloud_server_info | default([]) | length > 0

- name: "Note: firewall rules are set, but not attached to any server yet"
  ansible.builtin.debug:
    msg: >-
      Server '{{ box.name }}' not found — firewall '{{ firewall.name }}'
      and its rules are up to date, but not attached to anything yet. Run
      'make create' to bring up the server (it attaches this firewall
      automatically), or re-run this after it exists.
  when: >-
    fw_server.hcloud_server_info | default([]) | length == 0
    and not (firewall_require_attach | default(false))
