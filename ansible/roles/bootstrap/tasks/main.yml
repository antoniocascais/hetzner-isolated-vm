---
# Idempotent host config, run over the tailnet after `tailscale up`.

- name: "Set timezone"
  community.general.timezone:
    name: UTC

- name: "Update apt cache"
  ansible.builtin.apt:
    update_cache: true

- name: "Upgrade all packages"
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: "Check if reboot is required"
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: "Reboot if required"
  ansible.builtin.reboot:
    msg: "Rebooting after system updates"
    post_reboot_delay: 60
    test_command: uptime
  when: reboot_required_file.stat.exists

- name: "Install hardened sshd_config"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: "Remove cloud-init sshd drop-in (now superseded by managed config)"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hetzner-isolated-vm.conf
    state: absent
  notify: Restart sshd

- name: "Ensure ssh service enabled"
  ansible.builtin.systemd:
    name: ssh
    enabled: true
