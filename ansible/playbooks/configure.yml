---
# Phase 2: re-assert the firewall rule from your CURRENT IP (handles IP
# drift), THEN resolve the server's public IP and configure it over SSH.
#
# allow-ip runs FIRST, not last: if your IP has drifted since the last
# create/configure, the firewall still only allows the OLD IP. Doing the
# self-heal first means the "Wait for SSH" task below has a real chance of
# succeeding instead of hanging for its full 180s timeout and aborting on a
# box you could otherwise already reach.
- ansible.builtin.import_playbook: allow-ip.yml

- name: Resolve server and build inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Require token"
      ansible.builtin.assert:
        that: hcloud_api_token | length > 0
        fail_msg: "Set HCLOUD_TOKEN in .env"

    - name: "Look up server"
      hetzner.hcloud.server_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ box.name }}"
      register: cfg_server

    - name: "Fail if server missing"
      ansible.builtin.assert:
        that: cfg_server.hcloud_server_info | default([]) | length > 0
        fail_msg: "Server '{{ box.name }}' not found — run 'make create' first."

    - name: "Look up data volume"
      hetzner.hcloud.volume_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ volume.name }}"
      register: cfg_volume

    - name: "Fail if volume missing"
      ansible.builtin.assert:
        that: cfg_volume.hcloud_volume_info | default([]) | length > 0
        fail_msg: "Volume '{{ volume.name }}' not found — run 'make create' first."

    - name: "Fail if volume is not attached to this server"
      ansible.builtin.assert:
        that: cfg_volume.hcloud_volume_info[0].server == box.name
        fail_msg: >-
          Volume '{{ volume.name }}' is attached to
          '{{ cfg_volume.hcloud_volume_info[0].server | default("nothing", true) }}',
          not '{{ box.name }}' — run 'make create' to (re)attach it.

    - name: "Wait for SSH on BOX_SSH_PORT"
      # Hard fail: this box's only inbound surface is the port this play will
      # connect on. bootstrap moves sshd to BOX_SSH_PORT on first configure,
      # and changing it later is a rebuild (see RUNBOOK), so there is no
      # legitimate second port to wait on.
      ansible.builtin.wait_for:
        host: "{{ cfg_server.hcloud_server_info[0].ipv4_address }}"
        port: "{{ box.ssh_port }}"
        state: started
        delay: 5
        timeout: 180

    - name: "Add server to inventory"
      ansible.builtin.add_host:
        name: claude_box
        groups: claude_box
        ansible_host: "{{ cfg_server.hcloud_server_info[0].ipv4_address }}"
        ansible_user: "{{ box.user }}"
        ansible_port: "{{ box.ssh_port }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'BOX_SSH_KEY') | default('~/.ssh/hetzner-isolated-vm', true) }}"
        ansible_python_interpreter: /usr/bin/python3
        # No ansible_ssh_common_args here: the TOFU policy (accept-new) is set
        # once, for every host and play, via ssh_args in ansible.cfg — see
        # docs/decisions.md#ssh-host-key for the proven mechanics. Don't re-add
        # a per-host override: ssh_args composes first and OpenSSH takes the first
        # value for a repeated `-o`, so a re-add with the SAME value is merely
        # redundant, but a DIFFERENT value would be silently ignored, not
        # applied — a trap, not just a second place to keep in sync.
        volume_device: "{{ cfg_volume.hcloud_volume_info[0].linux_device }}"

- name: Configure the box over SSH
  hosts: claude_box
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Bootstrap the box (hardens sshd; moves it to BOX_SSH_PORT if needed)"
      ansible.builtin.include_role:
        name: bootstrap
      tags: [bootstrap]

    - name: "Mount the data volume"
      ansible.builtin.include_role:
        name: volume
      tags: [volume]

    - name: "Install Claude runtime"
      ansible.builtin.include_role:
        name: claude
      tags: [claude]