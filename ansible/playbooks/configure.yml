---
# Phase 2: resolve the server's public IP, configure it over SSH, then
# re-assert the firewall rule from your CURRENT IP (handles IP drift).
#
# allow-ip runs FIRST, not last: if your IP has drifted since the last
# create/configure, the firewall still only allows the OLD IP. Doing the
# self-heal first means the "Wait for SSH" task below has a real chance of
# succeeding instead of hanging for its full 180s timeout and aborting on a
# box you could otherwise already reach.
- ansible.builtin.import_playbook: allow-ip.yml

- name: Resolve server and build inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Require token"
      ansible.builtin.assert:
        that: hcloud_api_token | length > 0
        fail_msg: "Set HCLOUD_TOKEN in .env"

    - name: "Look up server"
      hetzner.hcloud.server_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ box.name }}"
      register: cfg_server

    - name: "Fail if server missing"
      ansible.builtin.assert:
        that: cfg_server.hcloud_server_info | default([]) | length > 0
        fail_msg: "Server '{{ box.name }}' not found — run 'make create' first."

    - name: "Look up data volume"
      hetzner.hcloud.volume_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ volume.name }}"
      register: cfg_volume

    - name: "Fail if volume missing"
      ansible.builtin.assert:
        that: cfg_volume.hcloud_volume_info | default([]) | length > 0
        fail_msg: "Volume '{{ volume.name }}' not found — run 'make create' first."

    - name: "Fail if volume is not attached to this server"
      ansible.builtin.assert:
        that: cfg_volume.hcloud_volume_info[0].server == box.name
        fail_msg: >-
          Volume '{{ volume.name }}' is attached to
          '{{ cfg_volume.hcloud_volume_info[0].server | default("nothing", true) }}',
          not '{{ box.name }}' — run 'make create' to (re)attach it.

    - name: "Wait for SSH on BOX_SSH_PORT"
      # ignore_errors only when the allow-ip play above (which now runs
      # FIRST) found a transitional fallback port -- i.e. box.ssh_port isn't
      # reachable YET because BOX_SSH_PORT was just changed and sshd hasn't
      # been moved there by bootstrap below. In the normal case (no
      # fallback known) this behaves exactly as before: a hard failure on
      # its own 180s timeout, unchanged.
      ansible.builtin.wait_for:
        host: "{{ cfg_server.hcloud_server_info[0].ipv4_address }}"
        port: "{{ box.ssh_port }}"
        state: started
        delay: 5
        timeout: 180
      register: cfg_wait_desired
      ignore_errors: "{{ (hostvars['localhost'].ssh_transition_fallback_ports | default([]) | length) > 0 }}"

    - name: "Fall back to a transitional SSH port (BOX_SSH_PORT changed but sshd hasn't moved there yet)"
      ansible.builtin.wait_for:
        host: "{{ cfg_server.hcloud_server_info[0].ipv4_address }}"
        port: "{{ item }}"
        state: started
        delay: 0
        timeout: 30
      register: cfg_wait_fallback
      loop: "{{ hostvars['localhost'].ssh_transition_fallback_ports | default([]) }}"
      when: cfg_wait_desired is failed
      ignore_errors: true

    - name: "Fail loudly if neither BOX_SSH_PORT nor any fallback port is reachable"
      ansible.builtin.assert:
        that: >-
          (cfg_wait_desired is succeeded) or
          ((cfg_wait_fallback.results | default([]) | selectattr('failed', 'equalto', false) | list | length) > 0)
        fail_msg: >-
          Could not reach the box on BOX_SSH_PORT ({{ box.ssh_port }}) or any
          transitional fallback port ({{ hostvars['localhost'].ssh_transition_fallback_ports | default([]) }}).
          It may just be slow to boot after a reboot/resume -- retry. If you
          changed BOX_SSH_PORT, confirm the box is actually up, then re-run
          `make allow-ip` first so the firewall allows whatever port sshd is
          really listening on right now.

    - name: "Determine which port to actually connect on"
      vars:
        succeeded_fallback_ports: "{{ cfg_wait_fallback.results | default([]) | selectattr('failed', 'equalto', false) | map(attribute='item') | list }}"
      ansible.builtin.set_fact:
        cfg_connect_port: "{{ box.ssh_port if (cfg_wait_desired is succeeded) else (succeeded_fallback_ports | first) }}"

    - name: "Add server to inventory"
      ansible.builtin.add_host:
        name: claude_box
        groups: claude_box
        ansible_host: "{{ cfg_server.hcloud_server_info[0].ipv4_address }}"
        ansible_user: "{{ box.user }}"
        ansible_port: "{{ cfg_connect_port }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'BOX_SSH_KEY') | default('~/.ssh/hetzner-isolated-vm', true) }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        volume_device: "{{ cfg_volume.hcloud_volume_info[0].linux_device }}"

- name: Configure the box over SSH
  hosts: claude_box
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Bootstrap the box (hardens sshd; moves it to BOX_SSH_PORT if needed)"
      ansible.builtin.include_role:
        name: bootstrap
      tags: [bootstrap]

    - name: "Reconnect on BOX_SSH_PORT if we got in via a transitional fallback port"
      # Bootstrap (above) may have just moved sshd from the port we actually
      # connected on (ansible_port, set by the fallback-connect logic in the
      # previous play) to box.ssh_port. Ansible's own connection for the
      # REST of this play still targets the OLD ansible_port unless told
      # otherwise -- without this, every task from here on tries to reach a
      # port sshd no longer listens on.
      #
      # This is include_tasks, not an inline block, because meta:
      # reset_connection does not support `when` -- a block-level `when`
      # around it is silently ignored (Ansible warns and runs it anyway),
      # which would drop the connection on every run, including the normal
      # steady-state case where the port never changed. include_tasks does
      # honor `when` and simply never loads the file, so put the guard here.
      ansible.builtin.include_tasks: tasks/reconnect-on-desired-port.yml
      when: (ansible_port | string) != (box.ssh_port | string)

    - name: "Mount the data volume"
      ansible.builtin.include_role:
        name: volume
      tags: [volume]

    - name: "Install Claude runtime"
      ansible.builtin.include_role:
        name: claude
      tags: [claude]
