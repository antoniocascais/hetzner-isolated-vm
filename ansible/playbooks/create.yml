---
# Phase 1: apply the firewall, then create the server already attached to it,
# so the box is never reachable except from your IP (no unfiltered window).
# Runs entirely against the Hetzner API from localhost — no SSH to the box.
- name: Create isolated VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Require token"
      ansible.builtin.assert:
        that: hcloud_api_token | length > 0
        fail_msg: "Set HCLOUD_TOKEN in .env"

    - name: "Read SSH public key"
      ansible.builtin.set_fact:
        ssh_public_key: "{{ lookup('file', lookup('env', 'BOX_SSH_PUBKEY_FILE') | default('~/.ssh/hetzner-isolated-vm.pub', true) | expanduser) | trim }}"

    - name: "Hash console password (if provided)"
      ansible.builtin.set_fact:
        console_password_hash: "{{ console_pw | password_hash('sha512') if console_pw | length > 0 else '' }}"
      vars:
        console_pw: "{{ lookup('env', 'BOX_CONSOLE_PASSWORD') | default('', true) }}"
      no_log: true

    - name: "Detect your current public IP (whitelist source)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/detect-public-ip.yml"

    - name: "Set whitelist CIDR"
      ansible.builtin.set_fact:
        whitelist_cidr: "{{ detected_public_ip }}/32"

    - name: "Build firewall rule (your IP only)"
      ansible.builtin.set_fact:
        firewall_rules:
          - direction: in
            protocol: tcp
            port: "{{ box.ssh_port | string }}"
            source_ips: ["{{ whitelist_cidr }}"]
            description: "SSH (whitelisted IP)"

    # Firewall FIRST, server second: the role creates/updates the firewall
    # object and its rules now (its attach step skips — no server exists yet),
    # then "Create server" below passes `firewalls:` so Hetzner attaches it
    # atomically at creation. There is no moment where the box sits on the open
    # internet unfiltered. The role (not an inline hetzner.hcloud.firewall
    # task) still runs the "every inbound rule is single-host" guard, so a
    # malformed whitelist_cidr is rejected before any server exists.
    - name: "Apply firewall (guard + create/update rules; attach to the server happens at creation)"
      ansible.builtin.include_role:
        name: firewall
      # This role runs BEFORE "Create server" below, so its server lookup
      # comes up empty and its attach step skips. Tell the role we are on the
      # create path so its "not attached to anything yet" note reads correctly
      # mid-create (it must not tell the operator to run the `make create`
      # they're already running). Default elsewhere is false = allow-ip
      # pre-seed guidance, which is the fail-safe for any unset caller.
      vars:
        firewall_create_path: true

    - name: "Create server"
      # no_log: user_data renders cloud-init, which embeds
      # console_password_hash (a SHA-512 crypt hash). Without this it can
      # leak into failure output or -v logs. The task's own args/result are
      # suppressed; `created` (registered below) is still usable normally by
      # later tasks — no_log only stops THIS task from printing it.
      hetzner.hcloud.server:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ box.name }}"
        server_type: "{{ box.server_type }}"
        image: "{{ box.image }}"
        location: "{{ box.location }}"
        user_data: "{{ lookup('template', playbook_dir + '/../templates/cloud-init.yaml.j2') }}"
        labels: "{{ box.labels }}"
        firewalls: ["{{ firewall.name }}"]
        state: present
      register: created
      no_log: true

    - name: "Look up existing volume (attachment-safety pre-check)"
      hetzner.hcloud.volume_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ volume.name }}"
      register: precheck_volume

    - name: "Refuse to attach a volume that's currently on a different server"
      # The hcloud volume module attaches unconditionally on a server-name
      # mismatch (its _update_volume() calls attach() with no guard of its own),
      # and `make create` must not yank a live filesystem off a running box.
      # Rationale + source proof: docs/decisions.md#volume-reattach. No-op in
      # the normal cases: volume doesn't exist yet, already attached to this
      # box, or unattached.
      vars:
        existing_owner: >-
          {{
            (precheck_volume.hcloud_volume_info[0].server | default('', true))
            if (precheck_volume.hcloud_volume_info | default([]) | length > 0)
            else ''
          }}
      ansible.builtin.assert:
        that: existing_owner in ['', box.name] or volume.allow_reattach
        fail_msg: >-
          Volume '{{ volume.name }}' is currently attached to server
          '{{ existing_owner }}', not '{{ box.name }}'. Continuing would try
          to attach it here instead, which risks pulling a live filesystem
          out from under a running machine (I/O errors at best, data
          corruption at worst). Rationale: docs/decisions.md#volume-reattach.

          If this is a deliberate migration (e.g. a blue/green cutover):
          first make sure '{{ existing_owner }}' is stopped — from an
          environment pointed at it, `make pause` powers it off without
          touching the volume or firewall (a stopped server has nothing
          mounted to disrupt). Then re-run this with VOLUME_ALLOW_REATTACH=true
          set (in your shell or .env) to confirm you mean it. This is a
          conscious, explicit act — never make it the default.

    - name: "Look up all volumes managed by this tool (orphan/drift detection)"
      hetzner.hcloud.volume_info:
        api_token: "{{ hcloud_api_token }}"
        label_selector: "managed_by=ansible,purpose=hetzner-isolated-vm-data"
      register: all_managed_volumes

    - name: "Refuse to silently provision a second, orphaned data volume"
      # If volume.name doesn't exist yet, the task below CREATES it fresh —
      # empty. That's exactly right the first time ever run, but if
      # VOLUME_NAME has drifted (typo, or "helpfully" changed to match a
      # renamed box) it silently starts a second, empty volume while your
      # real data sits under the old name, now unreferenced by this run and
      # billing forever. Catch it by checking whether any OTHER volume
      # already carries this tool's management labels — a fresh install has
      # none, so this is a no-op there.
      vars:
        target_exists: "{{ (precheck_volume.hcloud_volume_info | default([]) | length) > 0 }}"
        other_named_volumes: "{{ all_managed_volumes.hcloud_volume_info | default([]) | rejectattr('name', 'equalto', volume.name) | list }}"
      ansible.builtin.assert:
        that: target_exists or (other_named_volumes | length == 0) or volume.allow_new
        fail_msg: >-
          About to CREATE a brand-new, empty volume named '{{ volume.name }}',
          but {{ other_named_volumes | length }} other volume(s) already carry
          this tool's management labels:
          {{ other_named_volumes | map(attribute='name') | list }}.
          This usually means VOLUME_NAME drifted (typo, or changed to match a
          renamed BOX_NAME) — your real data is likely on one of those,
          about to be orphaned (and still billing) while a second, empty
          volume gets attached here instead.

          If this is deliberate (a genuine second or blue-green deployment),
          set VOLUME_ALLOW_NEW=true (in your shell or .env) to confirm you
          mean it. Otherwise, fix VOLUME_NAME to match the volume that
          actually has your data.

    - name: "Create + attach + format the persistent data volume"
      # `format` is only honored on first creation — the module's _create_volume()
      # is the only path that reads it; once the volume exists, _update_volume()
      # never touches `format`, so this structurally cannot reformat/wipe an
      # existing volume. delete_protection blocks `state: absent` too, as a
      # second, independent guard. Source proof: docs/decisions.md#volume-format-and-order.
      hetzner.hcloud.volume:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ volume.name }}"
        size: "{{ volume.size }}"
        server: "{{ box.name }}"
        format: ext4
        delete_protection: true
        labels: "{{ volume.labels }}"
        state: present
      register: created_volume

    - name: "Next steps"
      ansible.builtin.debug:
        msg:
          - "Server '{{ box.name }}' is at {{ created.hcloud_server.ipv4_address }}"
          - "Inbound SSH (port {{ box.ssh_port }}) open from {{ whitelist_cidr }} only; all else denied."
          - "Volume '{{ volume.name }}' ({{ volume.size }}GB) attached, ext4, delete-protected."
          - "Next: make configure   (auto-resolves the IP, installs Claude over SSH, mounts {{ volume.mount_path }})"
          - "Then: ssh -i ~/.ssh/hetzner-isolated-vm {{ box.user }}@{{ created.hcloud_server.ipv4_address }}"