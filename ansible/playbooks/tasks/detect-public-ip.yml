---
# Ask ipify for the operator's public IP and validate it's safe to use in a
# firewall /32 rule. One shared implementation, included from allow-ip.yml
# and create.yml (configure.yml gets it transitively via allow-ip.yml).
#
# Contract: sets exactly one fact, `detected_public_ip` — validated IPv4,
# guaranteed not private/loopback/link-local/CGNAT/multicast/reserved.
# Callers must never read this file's own register directly.
#
# The /32 built here is this box's ONLY inbound protection, and ipify is
# unauthenticated — so any answer that couldn't legitimately be a public
# source IP is a hard failure, never a valid-but-unlucky pass.
# Full proof: docs/decisions.md#detect-public-ip-validation.

- name: "Detect current public IP"
  ansible.builtin.uri:
    url: https://api.ipify.org?format=json
    return_content: true
  register: detect_ip_response

- name: "Reject an empty, missing, or non-JSON response body"
  ansible.builtin.assert:
    that:
      - detect_ip_response.json is defined
      - detect_ip_response.json.ip is defined
      - detect_ip_response.json.ip | default('') | length > 0
    fail_msg: >-
      https://api.ipify.org did not return the expected {"ip": "..."} JSON
      body (got: {{ detect_ip_response.content | default('<no content>') | truncate(200) }}).
      This usually means ipify is down, you're behind a captive portal, or
      something between here and ipify (a proxy, a DNS hijack) answered
      instead of the real service. A firewall rule built from a bad answer
      here is the ONLY thing standing between this box and the open internet
      on the SSH port, so this refuses to guess. Check connectivity to
      api.ipify.org and re-run.

- name: "Reject anything that isn't a syntactically valid IPv4 address"
  # Plain regex (no ansible.utils vendored), \Z-anchored, plus a separate
  # string-equality whitespace check. Why each choice:
  # docs/decisions.md#detect-public-ip-validation.
  ansible.builtin.assert:
    that:
      - detect_ip_response.json.ip == (detect_ip_response.json.ip | trim)
      - detect_ip_response.json.ip is match(ipv4_strict_regex)
    fail_msg: >-
      https://api.ipify.org returned '{{ detect_ip_response.json.ip }}',
      which is either not a syntactically valid IPv4 address or has
      leading/trailing whitespace (this also rejects IPv6 — this tool only
      ever builds IPv4 /32 firewall rules, and an IPv6 answer here would
      silently fail to protect the box over IPv4). Something between here
      and ipify likely answered instead of the real service, or ipify's
      response format changed. Check connectivity to api.ipify.org and
      re-run.
  vars:
    # Octet alternation deliberately identical to ipv4_slash32 in
    # roles/firewall/tasks/main.yml — keep the two in agreement.
    ipv4_strict_regex: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}\Z'

- name: "Reject syntactically valid IPv4 addresses that aren't a usable public source"
  vars:
    ip_octets: "{{ detect_ip_response.json.ip.split('.') | map('int') | list }}"
    o1: "{{ ip_octets[0] }}"
    o2: "{{ ip_octets[1] }}"
    is_this_network: "{{ o1 == 0 }}"
    is_loopback: "{{ o1 == 127 }}"
    is_link_local: "{{ o1 == 169 and o2 == 254 }}"
    is_rfc1918: >-
      {{
        o1 == 10
        or (o1 == 172 and o2 >= 16 and o2 <= 31)
        or (o1 == 192 and o2 == 168)
      }}
    is_cgnat: "{{ o1 == 100 and o2 >= 64 and o2 <= 127 }}"
    is_multicast: "{{ o1 >= 224 and o1 <= 239 }}"
    is_reserved_or_broadcast: "{{ o1 >= 240 }}"
    rejection_reason: >-
      {{
        'the "this network" range (0.0.0.0/8)' if is_this_network else
        'a loopback address (127.0.0.0/8)' if is_loopback else
        'a link-local address (169.254.0.0/16)' if is_link_local else
        'a private RFC1918 address' if is_rfc1918 else
        'a carrier-grade NAT address (100.64.0.0/10)' if is_cgnat else
        'a multicast address (224.0.0.0/4)' if is_multicast else
        'a reserved or broadcast address (240.0.0.0/4 or 255.255.255.255)' if is_reserved_or_broadcast else
        ''
      }}
  ansible.builtin.assert:
    that:
      - not (is_this_network or is_loopback or is_link_local or is_rfc1918 or is_cgnat or is_multicast or is_reserved_or_broadcast)
    fail_msg: >-
      https://api.ipify.org returned '{{ detect_ip_response.json.ip }}',
      which is {{ rejection_reason }}. That cannot legitimately be the
      operator's public IP, so something other than the real ipify service
      answered (a captive portal, a broken proxy, a DNS hijack, or similar).
      Using it would produce a firewall /32 SSH rule that is either useless
      or misleading rather than protecting this box. Check your network
      connectivity to api.ipify.org and re-run — do not force this value
      through.

- name: "Set detected_public_ip for callers"
  ansible.builtin.set_fact:
    detected_public_ip: "{{ detect_ip_response.json.ip }}"
