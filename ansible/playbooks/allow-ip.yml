---
# Re-detect your current public IP and update the firewall to allow SSH from it.
# Runs against the Hetzner API from localhost — works even if you're locked out
# of the box (e.g. your home IP changed). Safe to re-run anytime.
- name: Allow current IP through firewall
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: "Detect + validate current public IP"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/detect-public-ip.yml"

    - name: "Look up target server (best-effort — this playbook must still work before the server exists)"
      hetzner.hcloud.server_info:
        api_token: "{{ hcloud_api_token }}"
        name: "{{ box.name }}"
      register: aip_server

    - name: "Record whether the target server exists"
      # Must be a set_fact, not a task-level `vars:` entry: task-level vars
      # live only for their one task, and this value is read by `when:` on
      # the two "Result" debug tasks at the bottom of this play. As a
      # task-local var it was undefined by then (proven against ansible-core
      # 2.21.1: `'server_exists' is undefined`) — failing AFTER the firewall
      # had already been written, and aborting configure.yml (which imports
      # this playbook) before it reached the bootstrap role. set_fact
      # persists for the rest of the play.
      ansible.builtin.set_fact:
        server_exists: "{{ (aip_server.hcloud_server_info | default([]) | length) > 0 }}"

    - name: "Build firewall rule (your current IP only)"
      ansible.builtin.set_fact:
        firewall_rules:
          - direction: in
            protocol: tcp
            port: "{{ box.ssh_port | string }}"
            source_ips: ["{{ detected_public_ip }}/32"]
            description: "SSH (whitelisted IP)"

    - name: "Apply firewall"
      ansible.builtin.include_role:
        name: firewall

    - name: "Result"
      ansible.builtin.debug:
        msg: "Firewall now allows SSH (port {{ box.ssh_port }}) from {{ detected_public_ip }}/32."
      when: server_exists

    # This is the tool you reach for when you CAN'T get in, so the last line it
    # prints has to be honest about whether anything is actually protecting a
    # box. The firewall role attaches conditionally (it must, so you can
    # pre-seed your IP before `make create`), which means a BOX_NAME typo now
    # writes rules against a firewall attached to nothing instead of hard-
    # failing the way it used to. Exiting 0 is right; ending on an unqualified
    # "now allows SSH" while you're still locked out is not.
    - name: "Result (rules written, but not attached to anything)"
      ansible.builtin.debug:
        msg: >-
          Firewall '{{ firewall.name }}' now carries an SSH rule (port
          {{ box.ssh_port }}) for {{ detected_public_ip }}/32 — but no server named
          '{{ box.name }}' exists, so it is NOT attached to anything and nothing
          is being filtered yet. If you expected a running box, check BOX_NAME.
          Otherwise this is fine: `make create` will attach it.
      when: not server_exists